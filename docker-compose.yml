version: "3.9"

services:
  backend:
    build: .
    container_name: pillsafe_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: pillsafe_redis
    ports:
      - "6379:6379"version: "3.9"

